name: ERA5 nas horas da DREAM (agua, cape, neve)

# A reanálise ICON-DREAM não tem TQV, CAPE_ML nem H_SNOW: nas horas dela, as camadas agua, cape e neve do arquivo
# horário ficam vazias. Este workflow lê o ERA5 da cópia pública ARCO-ERA5 (Google Cloud, HTTPS anônimo), interpola
# para 0,125 grau, codifica como o gerar.py e envia ao HF só esses três .bin de cada mês, com origem 4 no índice
# (era5.py). Rodar depois que o lote do arquivo.yml do mês terminou. Só roda quando alguém dispara.
on:
  workflow_dispatch:
    inputs:
      meses:
        description: "Meses AAAA-MM separados por vírgula, intervalo AAAA-MM..AAAA-MM, ou 'dream' (todos os meses com horas da DREAM)"
        required: true
        default: "2019-01"
      dataset:
        description: "Dataset no Hugging Face (vazio = não envia, só mede)"
        default: "richardmelo/painel-nacional-icon"
      paralelo:
        description: "Jobs ao mesmo tempo"
        default: "10"
      conferir_mes:
        description: "Mês com quadro do ICON operacional para comparar com o ERA5 (vazio = não compara)"
        default: ""

concurrency:
  group: era5-${{ inputs.meses }}

jobs:
  planejar:
    runs-on: ubuntu-latest
    outputs:
      meses: ${{ steps.lista.outputs.meses }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy==2.5.4
      - id: lista
        run: python era5.py meses --meses "${{ inputs.meses }}"

  preencher:
    needs: planejar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.paralelo) }}
      matrix:
        mes: ${{ fromJSON(needs.planejar.outputs.meses) }}
    name: ERA5 ${{ matrix.mes }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependências
        run: |
          pip install -q -r requirements.txt huggingface_hub==2.2.0
          sudo mkdir -p /mnt/era5 && sudo chown -R "$USER" /mnt/era5
      - name: Preencher ${{ matrix.mes }}
        run: python era5.py preencher --mes ${{ matrix.mes }} --trabalho /mnt/era5 --jobs 8 --enviar "${{ inputs.dataset }}"
      - name: Resumo
        if: always()
        run: |
          ls -la /mnt/era5/saida/*/* 2>/dev/null | grep -v '^total' || true
          cat /mnt/era5/saida/meses/${{ matrix.mes }}-era5.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: era5-${{ matrix.mes }}
          path: /mnt/era5/saida/meses
          if-no-files-found: ignore
          retention-days: 7

  conferir:
    if: ${{ inputs.conferir_mes != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - name: ERA5 x ICON em ${{ inputs.conferir_mes }}
        run: python era5.py conferir --mes ${{ inputs.conferir_mes }} --trabalho /tmp/conferencia --horas 48
      - uses: actions/upload-artifact@v4
        with:
          name: conferencia-era5-${{ inputs.conferir_mes }}
          path: /tmp/conferencia
          retention-days: 7
